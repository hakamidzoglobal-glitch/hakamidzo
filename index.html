<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Hakamidzo Global — a marketplace connecting buyers, suppliers and partners to make sourcing, procurement and trade simple."
  >

  <title>Hakamidzo — Connect, let's go.</title>

  <style>
    /* =========================================================
       HAKAMIDZO GLOBAL
       Main storefront
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #123c32;
      --green-dark: #08251f;
      --green-light: #1c5748;

      --cream: #f7f1e5;
      --cream-light: #fcfaf4;

      --gold: #c9a86a;
      --gold-light: #e1c992;

      --text: #17342d;
      --muted: #68756f;

      --white: #ffffff;

      --border: rgba(18, 60, 50, 0.12);

      --shadow:
        0 15px 40px rgba(18, 60, 50, 0.10);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--cream-light);
      color: var(--text);
      line-height: 1.5;

      overflow-x: hidden;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background:
        rgba(252, 250, 244, 0.96);

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav {
      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      flex-shrink: 0;
    }

    .logo {
      width: 46px;
      height: 46px;

      border-radius: 14px;

      background: var(--green);
      color: var(--gold-light);

      display: grid;
      place-items: center;

      font-size: 25px;
      font-weight: 900;

      box-shadow:
        0 8px 20px rgba(18, 60, 50, 0.18);
    }

    .brand-text strong {
      display: block;

      font-size: 17px;
      letter-spacing: 2px;

      color: var(--green);
    }

    .brand-text span {
      display: block;

      font-size: 11px;
      color: var(--muted);

      margin-top: 1px;
    }

    .nav-links {
      display: flex;
      align-items: center;

      gap: 6px;
    }

    .nav-links a {
      padding: 10px 14px;

      border-radius: 10px;

      font-size: 13px;
      font-weight: 800;

      color: var(--text);

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .nav-links a:hover {
      background: var(--cream);
      color: var(--green);
      transform: translateY(-1px);
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;

      background:
        radial-gradient(
          circle at 12% 15%,
          rgba(201, 168, 106, 0.18),
          transparent 28%
        ),
        radial-gradient(
          circle at 88% 25%,
          rgba(28, 87, 72, 0.13),
          transparent 30%
        ),
        var(--cream);

      padding: 90px 0 75px;

      overflow: hidden;
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(420px, 0.9fr);

      align-items: center;

      gap: 60px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      background:
        rgba(18, 60, 50, 0.08);

      color: var(--green);

      border:
        1px solid rgba(18, 60, 50, 0.12);

      border-radius: 999px;

      padding: 8px 14px;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      margin-bottom: 22px;
    }

    .eyebrow::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--gold);
    }

    h1 {
      font-size:
        clamp(44px, 6vw, 76px);

      line-height: 0.98;

      letter-spacing: -3px;

      color: var(--green-dark);

      margin-bottom: 23px;
    }

    h1 span {
      color: var(--gold);
    }

    .hero-copy {
      max-width: 650px;

      font-size: 19px;

      color: var(--muted);

      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;

      gap: 12px;

      flex-wrap: wrap;
    }

    .btn {
      min-height: 53px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 24px;

      border-radius: 12px;

      font-size: 14px;
      font-weight: 900;

      border:
        1px solid transparent;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--green);
      color: white;

      box-shadow:
        0 12px 28px rgba(18, 60, 50, 0.20);
    }

    .btn-primary:hover {
      background: var(--green-light);

      box-shadow:
        0 16px 32px rgba(18, 60, 50, 0.25);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.55);

      border-color:
        rgba(18, 60, 50, 0.18);

      color: var(--green);
    }


    /* =========================================================
       CONNECTION NETWORK
       ========================================================= */

    .network {
      min-height: 450px;

      position: relative;

      display: grid;
      place-items: center;
    }

    .network-ring {
      width: 350px;
      height: 350px;

      border:
        1px solid rgba(18, 60, 50, 0.13);

      border-radius: 50%;

      position: relative;
    }

    .network-ring::before {
      content: "";

      position: absolute;

      inset: 38px;

      border:
        1px dashed rgba(201, 168, 106, 0.65);

      border-radius: 50%;
    }

    .network-center {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 115px;
      height: 115px;

      border-radius: 32px;

      background: var(--green);
      color: var(--gold-light);

      display: grid;
      place-items: center;

      font-size: 60px;
      font-weight: 900;

      box-shadow:
        0 20px 45px rgba(18, 60, 50, 0.24);

      z-index: 3;
    }

    .connection-line {
      position: absolute;

      background:
        rgba(18, 60, 50, 0.18);

      transform-origin: left center;

      height: 2px;
      width: 125px;

      left: 50%;
      top: 50%;

      z-index: 1;
    }

    .line-top {
      transform: rotate(-90deg);
    }

    .line-right {
      transform: rotate(0deg);
    }

    .line-bottom {
      transform: rotate(90deg);
    }

    .line-left {
      transform: rotate(180deg);
    }

    .node {
      position: absolute;

      width: 112px;
      min-height: 105px;

      border-radius: 22px;

      background: white;

      border:
        1px solid var(--border);

      box-shadow:
        0 14px 35px rgba(18, 60, 50, 0.10);

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 5px;

      z-index: 4;

      text-align: center;
    }

    .node .icon {
      font-size: 31px;
      line-height: 1;
    }

    .node strong {
      font-size: 12px;
      color: var(--green);

      letter-spacing: 0.4px;
    }

    .node small {
      font-size: 9px;
      color: var(--muted);
    }

    .node-top {
      top: -5px;
      left: 50%;

      transform:
        translateX(-50%);
    }

    .node-right {
      right: -18px;
      top: 50%;

      transform:
        translateY(-50%);
    }

    .node-bottom {
      bottom: -5px;
      left: 50%;

      transform:
        translateX(-50%);
    }

    .node-left {
      left: -18px;
      top: 50%;

      transform:
        translateY(-50%);
    }


    /* =========================================================
       GENERAL SECTIONS
       ========================================================= */

    section {
      padding: 90px 0;
    }

    .section-heading {
      max-width: 720px;

      text-align: center;

      margin:
        0 auto 48px;
    }

    .section-heading .eyebrow {
      margin-bottom: 14px;
    }

    h2 {
      font-size:
        clamp(30px, 4vw, 48px);

      line-height: 1.05;

      letter-spacing: -1.5px;

      color: var(--green-dark);

      margin-bottom: 14px;
    }

    .section-heading p {
      color: var(--muted);

      font-size: 16px;
    }


    /* =========================================================
       GATEWAYS
       ========================================================= */

    .gateways {
      background: var(--cream-light);
    }

    .gateway-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 20px;
    }

    .gateway {
      min-height: 285px;

      position: relative;

      overflow: hidden;

      border-radius: 24px;

      padding: 30px;

      display: flex;
      flex-direction: column;

      border:
        1px solid rgba(255,255,255,0.25);

      color: white;

      box-shadow:
        0 12px 30px rgba(18, 60, 50, 0.10);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .gateway:hover {
      transform:
        translateY(-7px);

      box-shadow:
        0 24px 48px rgba(18, 60, 50, 0.18);
    }

    .gateway::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      border-radius: 50%;

      right: -75px;
      top: -75px;

      background:
        rgba(255,255,255,0.10);
    }

    .gateway::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      border-radius: 50%;

      left: -55px;
      bottom: -60px;

      background:
        rgba(255,255,255,0.06);
    }

    .gateway-icon {
      width: 72px;
      height: 72px;

      border-radius: 20px;

      display: grid;
      place-items: center;

      background:
        rgba(255,255,255,0.16);

      border:
        1px solid rgba(255,255,255,0.18);

      font-size: 38px;

      margin-bottom: 24px;

      position: relative;
      z-index: 2;
    }

    .gateway h3 {
      position: relative;
      z-index: 2;

      font-size: 20px;

      letter-spacing: 0.2px;

      margin-bottom: 10px;
    }

    .gateway p {
      position: relative;
      z-index: 2;

      max-width: 310px;

      font-size: 13px;

      line-height: 1.65;

      color:
        rgba(255,255,255,0.78);
    }

    .gateway-arrow {
      position: relative;
      z-index: 2;

      margin-top: auto;

      padding-top: 25px;

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 1px;

      color: rgba(255,255,255,0.92);
    }


    /* INDIVIDUAL CARD COLORS */

    .gateway-buyer {
      background:
        linear-gradient(
          145deg,
          #123c32,
          #1b5a4a
        );
    }

    .gateway-explore {
      background:
        linear-gradient(
          145deg,
          #17465a,
          #236f7c
        );
    }

    .gateway-supplier {
      background:
        linear-gradient(
          145deg,
          #9a7130,
          #c9a86a
        );

      color: #fff;
    }

    .gateway-partner {
      background:
        linear-gradient(
          145deg,
          #633b48,
          #8a5260
        );
    }

    .gateway-account {
      background:
        linear-gradient(
          145deg,
          #303b3d,
          #4c5a5d
        );
    }

    .gateway-support {
      background:
        linear-gradient(
          145deg,
          #31536b,
          #4f7890
        );
    }


    /* =========================================================
       HAKAMIDZO WAY
       ========================================================= */

    .way {
      background: var(--green);

      color: white;

      position: relative;

      overflow: hidden;
    }

    .way::before {
      content: "H";

      position: absolute;

      right: -40px;
      bottom: -100px;

      font-size: 420px;
      font-weight: 900;

      color:
        rgba(255,255,255,0.025);

      line-height: 1;
    }

    .way .section-heading h2 {
      color: white;
    }

    .way .section-heading p {
      color:
        rgba(255,255,255,0.68);
    }

    .way .eyebrow {
      color: var(--gold-light);

      background:
        rgba(255,255,255,0.08);

      border-color:
        rgba(255,255,255,0.12);
    }

    .steps {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 15px;

      position: relative;

      z-index: 2;
    }

    .step {
      padding: 30px 22px;

      border:
        1px solid rgba(255,255,255,0.12);

      border-radius: 18px;

      background:
        rgba(255,255,255,0.055);

      text-align: center;
    }

    .step-number {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      margin:
        0 auto 18px;

      background: var(--gold);

      color: var(--green-dark);

      display: grid;
      place-items: center;

      font-weight: 900;
    }

    .step h3 {
      margin-bottom: 8px;

      color: white;

      font-size: 17px;
    }

    .step p {
      font-size: 12px;

      color:
        rgba(255,255,255,0.65);
    }


    /* =========================================================
       TRUST
       ========================================================= */

    .trust-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 20px;
    }

    .trust-card {
      padding: 32px;

      border-radius: 20px;

      background: var(--cream);

      border:
        1px solid rgba(18,60,50,0.08);
    }

    .trust-icon {
      font-size: 34px;

      margin-bottom: 18px;
    }

    .trust-card h3 {
      color: var(--green);

      margin-bottom: 9px;
    }

    .trust-card p {
      font-size: 13px;

      color: var(--muted);
    }


    /* =========================================================
       CTA
       ========================================================= */

    .cta {
      padding:
        25px 0 90px;
    }

    .cta-box {
      background:
        radial-gradient(
          circle at 90% 20%,
          rgba(201,168,106,0.25),
          transparent 30%
        ),
        var(--cream);

      border:
        1px solid rgba(18,60,50,0.10);

      border-radius: 28px;

      padding:
        60px 45px;

      text-align: center;
    }

    .cta-box h2 {
      max-width: 700px;

      margin:
        0 auto 15px;
    }

    .cta-box p {
      max-width: 600px;

      margin:
        0 auto 28px;

      color: var(--muted);
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      background: var(--green-dark);

      color: white;

      padding:
        55px 0 25px;
    }

    .footer-grid {
      display: grid;

      grid-template-columns:
        1.5fr 1fr 1fr 1fr;

      gap: 40px;

      padding-bottom: 45px;

      border-bottom:
        1px solid rgba(255,255,255,0.10);
    }

    .footer-brand .brand {
      margin-bottom: 17px;
    }

    .footer-brand .brand-text strong {
      color: white;
    }

    .footer-brand .brand-text span {
      color:
        rgba(255,255,255,0.55);
    }

    .footer-brand p {
      max-width: 320px;

      color:
        rgba(255,255,255,0.55);

      font-size: 13px;
    }

    .footer-column h4 {
      color: var(--gold-light);

      font-size: 12px;

      letter-spacing: 1px;

      text-transform: uppercase;

      margin-bottom: 17px;
    }

    .footer-column a {
      display: block;

      color:
        rgba(255,255,255,0.62);

      font-size: 13px;

      margin-bottom: 10px;
    }

    .footer-column a:hover {
      color: white;
    }

    .copyright {
      padding-top: 22px;

      color:
        rgba(255,255,255,0.4);

      font-size: 11px;

      display: flex;

      justify-content: space-between;

      gap: 20px;

      flex-wrap: wrap;
    }


    /* =========================================================
       TABLETS
       ========================================================= */

    @media (max-width: 1000px) {

      .hero-grid {
        grid-template-columns: 1fr;

        gap: 35px;
      }

      .hero-copy {
        max-width: 700px;
      }

      .network {
        min-height: 410px;
      }

      .gateway-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .steps {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .trust-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .footer-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .container {
        width:
          min(100% - 28px, 1180px);
      }

      header {
        position: relative;
      }

      .nav {
        min-height: 70px;
      }

      .nav-links {
        display: none;
      }

      .logo {
        width: 43px;
        height: 43px;

        border-radius: 13px;

        font-size: 23px;
      }

      .brand-text strong {
        font-size: 15px;
      }

      .brand-text span {
        font-size: 10px;
      }

      .hero {
        padding:
          52px 0 35px;
      }

      h1 {
        font-size: 48px;

        letter-spacing: -2px;
      }

      .hero-copy {
        font-size: 16px;
      }

      .hero-buttons {
        flex-direction: column;

        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .network {
        min-height: 350px;

        transform:
          scale(0.82);

        margin:
          -30px -40px;
      }

      section {
        padding:
          65px 0;
      }

  
    .section-heading {
        margin-bottom: 35px;
      }

      .gateway-grid {
        grid-template-columns: 1fr;

        gap: 16px;
      }

      .gateway {
        min-height: 270px;

        padding: 27px;
      }

      .gateway-icon {
        width: 68px;
        height: 68px;

        font-size: 35px;
      }

      .steps {
        grid-template-columns: 1fr;
      }

      .trust-grid {
        grid-template-columns: 1fr;
      }

      .cta {
        padding:
          10px 0 65px;
      }

      .cta-box {
        padding:
          45px 22px;
      }

      .footer-grid {
        grid-template-columns: 1fr;

        gap: 30px;
      }

      .copyright {
        display: block;
      }

      .copyright span {
        display: block;

        margin-bottom: 7px;
      }
    }


    /* =========================================================
       SMALL PHONES
       ========================================================= */

    @media (max-width: 420px) {

      h1 {
        font-size: 42px;
      }

      .network {
        transform:
          scale(0.72);

        margin:
          -55px -65px;
      }

      .gateway {
        min-height: 260px;
      }
