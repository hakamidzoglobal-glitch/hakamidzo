<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hakamidzo Global — Where the world connects. Discover products, services, businesses and opportunities, or tell Hakamidzo what you need." />
  <meta name="theme-color" content="#123C32" />
  <title>Hakamidzo Global — Connect, let's go.</title>

  <style>
    :root {
      --green: #123C32;
      --green-dark: #0A2922;
      --green-light: #1B5547;
      --cream: #F7F1E5;
      --cream-light: #FCF9F2;
      --gold: #C9A86A;
      --gold-light: #E1C992;
      --text: #17342D;
      --muted: #66736E;
      --white: #FFFFFF;
      --border: rgba(18, 60, 50, 0.12);
      --shadow: 0 18px 50px rgba(18, 60, 50, 0.10);
      --shadow-hover: 0 25px 65px rgba(18, 60, 50, 0.17);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream-light);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(252, 249, 242, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--green);
      color: var(--cream);
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 8px 25px rgba(18, 60, 50, 0.20);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--green);
    }

    .brand-tagline {
      font-size: 11px;
      color: var(--gold);
      font-weight: 800;
      margin-top: -2px;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .desktop-nav a {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 750;
      color: var(--text);
      transition: 0.25s ease;
    }

    .desktop-nav a:hover {
      background: rgba(18, 60, 50, 0.07);
      color: var(--green);
    }

    .account-button {
      background: var(--green) !important;
      color: var(--white) !important;
      padding: 11px 17px !important;
      box-shadow: 0 8px 20px rgba(18, 60, 50, 0.16);
    }

    .account-button:hover {
      transform: translateY(-1px);
      background: var(--green-dark) !important;
    }

    .mobile-menu-button {
      display: none;
      border: 0;
      background: var(--green);
      color: white;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      font-size: 22px;
      cursor: pointer;
    }

    .mobile-menu {
      display: none;
      width: min(1180px, calc(100% - 40px));
      margin: auto;
      padding: 0 0 20px;
    }

    .mobile-menu.open {
      display: grid;
      gap: 7px;
    }

    .mobile-menu a {
      background: white;
      padding: 13px 16px;
      border-radius: 14px;
      font-weight: 750;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      padding: 90px 20px 70px;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(201, 168, 106, 0.15), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(18, 60, 50, 0.09), transparent 30%),
        var(--cream-light);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 480px;
      height: 480px;
      border: 1px solid rgba(201, 168, 106, 0.18);
      border-radius: 50%;
      right: -210px;
      top: -220px;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(18, 60, 50, 0.10);
      border-radius: 50%;
      left: -170px;
      bottom: -190px;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: min(1180px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 60px;
    }

    .hero-copy {
      max-width: 650px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(18, 60, 50, 0.07);
      color: var(--green);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 23px;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }

    .hero h1 {
      font-size: clamp(45px, 7vw, 82px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      color: var(--green);
      margin-bottom: 25px;
      font-weight: 950;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-subtitle {
      font-size: clamp(21px, 3vw, 32px);
      line-height: 1.15;
      font-weight: 850;
      color: var(--text);
      margin-bottom: 18px;
    }

    .hero-description {
      max-width: 600px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .primary-button,
    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      padding: 0 21px;
      border-radius: 15px;
      font-weight: 850;
      font-size: 14px;
      transition: 0.25s ease;
    }

    .primary-button {
      background: var(--green);
      color: var(--white);
      box-shadow: 0 12px 28px rgba(18, 60, 50, 0.18);
    }

    .primary-button:hover {
      transform: translateY(-3px);
      background: var(--green-dark);
      box-shadow: 0 17px 35px rgba(18, 60, 50, 0.22);
    }

    .secondary-button {
      background: white;
      border: 1px solid var(--border);
      color: var(--green);
    }

    .secondary-button:hover {
      transform: translateY(-3px);
      border-color: rgba(201, 168, 106, 0.65);
      box-shadow: var(--shadow);
    }

    /* =========================
       CONNECTION HUB
    ========================= */

    .connection-stage {
      min-height: 500px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .connection-ring {
      position: absolute;
      width: 410px;
      height: 410px;
      border: 1px dashed rgba(18, 60, 50, 0.20);
      border-radius: 50%;
    }

    .connection-ring.two {
      width: 305px;
      height: 305px;
      border-style: solid;
      border-color: rgba(201, 168, 106, 0.22);
    }

    .hub {
      position: relative;
      z-index: 4;
      width: 145px;
      height: 145px;
      border-radius: 42px;
      background: var(--green);
      color: white;
      display: grid;
      place-items: center;
      box-shadow:
        0 28px 70px rgba(18, 60, 50, 0.28),
        inset 0 0 0 8px rgba(255, 255, 255, 0.04);
    }

    .hub-letter {
      font-size: 67px;
      line-height: 1;
      font-weight: 950;
    }

    .hub-label {
      position: absolute;
      bottom: 17px;
      font-size: 10px;
      letter-spacing: 0.18em;
      font-weight: 900;
      color: var(--gold-light);
    }

    .connection-line {
      position: absolute;
      width: 170px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 106, 0.75), transparent);
      transform-origin: center;
      z-index: 1;
    }

    .line-one {
      transform: rotate(0deg);
    }

    .line-two {
      transform: rotate(90deg);
    }

    .line-three {
      transform: rotate(45deg);
    }

    .line-four {
      transform: rotate(-45deg);
    }

    .node {
      position: absolute;
      z-index: 5;
      width: 105px;
      height: 105px;
      border-radius: 29px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      box-shadow: 0 18px 45px rgba(18, 60, 50, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      transition: 0.25s ease;
    }

    .node:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(201, 168, 106, 0.45);
    }

    .node-icon {
      font-size: 35px;
      line-height: 1;
    }

    .node-name {
      font-size: 11px;
      font-weight: 900;
      color: var(--green);
    }

    .node-buyers {
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
    }

    .node-business {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .node-supplier {
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
    }

    .node-partner {
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .connection-note {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    /* =========================
       SECTION COMMON
    ========================= */

    section {
      padding: 95px 20px;
    }

    .section-inner {
      width: min(1180px, 100%);
      margin: auto;
    }

    .section-heading {
      text-align: center;
      max-width: 730px;
      margin: 0 auto 50px;
    }

    .section-kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      color: var(--green);
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 15px;
      font-weight: 950;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    /* =========================
       GATEWAYS
    ========================= */

    .gateways-section {
      background: var(--white);
    }

    .gateway-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .gateway-card {
      position: relative;
      min-height: 290px;
      padding: 30px;
      border-radius: var(--radius);
      background: var(--cream-light);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.3s ease;
    }

    .gateway-card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      right: -80px;
      top: -80px;
      background: rgba(201, 168, 106, 0.10);
      transition: 0.3s ease;
    }

    .gateway-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(201, 168, 106, 0.42);
    }

    .gateway-card:hover::before {
      transform: scale(1.35);
    }

    .gateway-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }

    .gateway-icon {
      width: 72px;
      height: 72px;
      border-radius: 21px;
      background: var(--green);
      display: grid;
      place-items: center;
      font-size: 39px;
      box-shadow: 0 12px 28px rgba(18, 60, 50, 0.16);
    }

    .gateway-number {
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.1em;
    }

    .gateway-content {
      position: relative;
      z-index: 2;
      margin-top: 30px;
    }

    .gateway-content h3 {
      font-size: 22px;
      line-height: 1.1;
      color: var(--green);
      margin-bottom: 10px;
      font-weight: 950;
    }

    .gateway-content p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .gateway-link {
      position: relative;
      z-index: 2;
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
    }

    .gateway-link span {
      transition: 0.2s ease;
    }

    .gateway-card:hover .gateway-link span {
      transform: translateX(5px);
    }

    /* =========================
       HOW IT WORKS
    ========================= */

    .way-section {
      background:
        linear-gradient(rgba(18, 60, 50, 0.97), rgba(18, 60, 50, 0.97)),
        var(--green);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .way-section::before {
      content: "";
      position: absolute;
      width: 550px;
      height: 550px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      right: -260px;
      top: -250px;
    }

    .way-section .section-heading h2 {
      color: white;
    }

    .way-section .section-heading p {
      color: rgba(255, 255, 255, 0.70);
    }

    .way-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .way-grid::before {
      content: "";
      position: absolute;
      top: 51px;
      left: 10%;
      right: 10%;
      height: 1px;
      background: rgba(201, 168, 106, 0.42);
    }

    .way-card {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .way-number {
      width: 102px;
      height: 102px;
      margin: auto;
      border-radius: 50%;
      background: var(--green);
      border: 1px solid rgba(201, 168, 106, 0.60);
      display: grid;
      place-items: center;
      font-size: 35px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    .way-card h3 {
      margin-top: 20px;
      font-size: 19px;
      font-weight: 900;
      color: var(--gold-light);
    }

    .way-card p {
      max-width: 220px;
      margin: 8px auto 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       TRUST
    ========================= */

    .trust-section {
      background: var(--cream);
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .trust-card {
      background: white;
      border-radius: 23px;
      padding: 28px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 35px rgba(18, 60, 50, 0.06);
    }

    .trust-icon {
      font-size: 43px;
      margin-bottom: 17px;
    }

    .trust-card h3 {
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .trust-card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    /* =========================
       CTA
    ========================= */

    .cta-section {
      background: var(--white);
      padding-top: 70px;
      padding-bottom: 100px;
    }

    .cta-box {
      position: relative;
      overflow: hidden;
      background: var(--green);
      color: white;
      border-radius: 32px;
      padding: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      box-shadow: 0 25px 70px rgba(18, 60, 50, 0.18);
    }

    .cta-box::after {
      content: "H";
      position: absolute;
      right: 20px;
      bottom: -75px;
      font-size: 260px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.035);
      font-weight: 950;
    }

    .cta-copy {
      position: relative;
      z-index: 2;
      max-width: 680px;
    }

    .cta-copy h2 {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.05;
      margin-bottom: 14px;
      font-weight: 950;
    }

    .cta-copy p {
      color: rgba(255, 255, 255, 0.70);
      font-size: 15px;
      line-height: 1.7;
    }

    .cta-action {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    .cta-action a {
      background: var(--gold);
      color: var(--green-dark);
      min-height: 54px;
      padding: 0 24px;
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 950;
      transition: 0.25s ease;
    }

    .cta-action a:hover {
      background: var(--gold-light);
      transform: translateY(-3px);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: var(--green-dark);
      color: white;
      padding: 55px 20px 25px;
    }

    .footer-inner {
      width: min(1180px, 100%);
      margin: auto;
    }

    .footer-top {
      display: grid;
      grid-template-columns: 1.4fr repeat(3, 1fr);
      gap: 45px;
      padding-bottom: 45px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .footer-brand {
      max-width: 330px;
    }

    .footer-brand .brand {
      margin-bottom: 18px;
    }

    .footer-brand .brand-name {
      color: white;
    }

    .footer-brand p {
      color: rgba(255, 255, 255, 0.58);
      font-size: 13px;
      line-height: 1.7;
    }

    .footer-column h4 {
      color: var(--gold-light);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 900;
    }

    .footer-column {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
    }

    .footer-column a {
      color: rgba(255, 255, 255, 0.62);
      font-size: 13px;
      transition: 0.2s ease;
    }

    .footer-column a:hover {
      color: white;
      transform: translateX(2px);
    }

    .footer-bottom {
      padding-top: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 11px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 950px) {
      .desktop-nav {
        display: none;
      }

      .mobile-menu-button {
        display: block;
      }

      .hero-inner {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .hero-copy {
        text-align: center;
        margin: auto;
      }

      .hero-description {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-actions {
        justify-content: center;
      }

      .gateway-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .way-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 45px 15px;
      }

      .way-grid::before {
        display: none;
      }

      .trust-grid {
        grid-template-columns: 1fr;
      }

      .footer-top {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .nav {
        width: min(100% - 28px, 1180px);
        min-height: 70px;
      }

      .brand-mark {
        width: 43px;
        height: 43px;
        border-radius: 13px;
      }

      .brand-name {
        font-size: 17px;
      }

      .hero {
        padding: 65px 16px 55px;
      }

      .hero h1 {
        font-size: clamp(43px, 15vw, 68px
