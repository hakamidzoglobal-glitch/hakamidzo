<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hakamidzo — Connect, let’s go.</title>

    <meta
        name="description"
        content="Hakamidzo connects buyers, suppliers and partners to make sourcing, procurement and trade simple."
    />

    <meta name="theme-color" content="#123C32">

    <style>
        :root {
            --green: #123C32;
            --green-dark: #0B2A23;
            --cream: #F7F1E5;
            --white: #FFFFFF;
            --gold: #C9A86A;
            --gold-light: #E5D3A8;
            --text: #171A18;
            --muted: #596660;
            --border: rgba(18, 60, 50, 0.12);
            --shadow: 0 18px 50px rgba(18, 60, 50, 0.08);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        .nav {
            max-width: 1400px;
            margin: auto;
            min-height: 78px;
            padding: 14px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--green);
            color: var(--white);
            font-size: 21px;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(18, 60, 50, 0.18);
        }

        .brand-name {
            color: var(--green);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand-tagline {
            color: var(--muted);
            font-size: 11px;
            margin-top: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: var(--green);
        }

        .nav-links a {
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        .nav-account {
            padding: 10px 15px;
            border-radius: 30px;
            background: var(--green);
            color: var(--white) !important;
        }

        .mobile-menu {
            display: none;
            border: 0;
            background: transparent;
            color: var(--green);
            font-size: 26px;
            cursor: pointer;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            max-width: 1400px;
            margin: auto;
            padding: 95px 36px 80px;
            min-height: 650px;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(380px, 0.85fr);
            align-items: center;
            gap: 70px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 15px;
            border-radius: 30px;
            background: #DCE7DE;
            color: var(--green);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.4px;
        }

        .eyebrow-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold);
        }

        .hero h1 {
            margin-top: 24px;
            max-width: 800px;
            color: var(--green);
            font-size: clamp(48px, 6vw, 84px);
            line-height: 1.02;
            letter-spacing: -4px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero-description {
            max-width: 680px;
            margin-top: 25px;
            color: var(--muted);
            font-size: 19px;
            line-height: 1.7;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
            margin-top: 34px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 50px;
            padding: 0 21px;
            border-radius: 14px;
            border: 1px solid transparent;
            font-size: 12px;
            font-weight: 850;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            background: var(--green);
            color: var(--white);
            box-shadow: 0 12px 30px rgba(18, 60, 50, 0.18);
        }

        .button-secondary {
            background: var(--white);
            color: var(--green);
            border-color: var(--border);
        }

        /* =========================
           CONNECTION VISUAL
        ========================= */

        .connection {
            position: relative;
            width: min(100%, 500px);
            aspect-ratio: 1 / 1;
            margin: auto;
        }

        .orbit {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(18, 60, 50, 0.13);
        }

        .orbit-one {
            inset: 9%;
        }

        .orbit-two {
            inset: 23%;
            border-color: rgba(201, 168, 106, 0.45);
        }

        .connection-core {
            position: absolute;
            inset: 34%;
            border-radius: 50%;
            background: var(--green);
            color: var(--white);
            display: grid;
            place-items: center;
            font-size: 42px;
            font-weight: 900;
            box-shadow: 0 25px 65px rgba(18, 60, 50, 0.25);
            z-index: 3;
        }

        .connection-node {
            position: absolute;
            min-width: 108px;
            padding: 12px 10px;
            border-radius: 15px;
            background: var(--white);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            z-index: 4;
        }

        .node-buyers {
            left: 0;
            top: 8%;
        }

        .node-businesses {
            right: 0;
            top: 8%;
        }

        .node-suppliers {
            left: 0;
            bottom: 8%;
        }

        .node-partners {
            right: 0;
            bottom: 8%;
        }

        /* =========================
           GATEWAYS
        ========================= */

        .section {
            max-width: 1400px;
            margin: auto;
            padding: 40px 36px 100px;
        }

        .section-heading {
            max-width: 700px;
            margin-bottom: 30px;
        }

        .section-label {
            color: var(--gold);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.7px;
        }

        .section-heading h2 {
            margin-top: 8px;
            color: var(--green);
            font-size: clamp(30px, 4vw, 48px);
            line-height: 1.1;
            letter-spacing: -1.5px;
        }

        .section-heading p {
            margin-top: 12px;
            color: var(--muted);
        }

        .gateway-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .gateway {
            min-height: 260px;
            padding: 30px;
            border-radius: var(--radius);
            background: var(--white);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .gateway:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 60px rgba(18, 60, 50, 0.13);
        }

        .gateway.dark {
            background: var(--green);
            color: var(--white);
        }

        .gateway.gold {
            background: var(--gold);
            color: var(--green);
        }

        .gateway-icon {
            font-size: 42px;
            line-height: 1;
        }

        .gateway-number {
            display: block;
            margin-top: 22px;
            color: var(--gold);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .gateway h3 {
            margin-top: 7px;
            font-size: 19px;
            line-height: 1.25;
        }

        .gateway p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .gateway.dark p {
            color: rgba(255, 255, 255, 0.72);
        }

        .gateway.gold p {
            color: rgba(18, 60, 50, 0.72);
        }

        .gateway-arrow {
            align-self: flex-start;
            margin-top: 22px;
            font-size: 22px;
            font-weight: 900;
        }

        /* =========================
           TRUST / SUPPORT
        ========================= */

        .trust-section {
            background: var(--white);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .trust-content {
            max-width: 1400px;
            margin: auto;
            padding: 90px 36px;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 60px;
            align-items: center;
        }

        .trust-content h2 {
            color: var(--green);
            font-size: clamp(32px, 4vw, 52px);
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .trust-content > div > p {
            margin-top: 18px;
            color: var(--muted);
        }

        .trust-list {
            display: grid;
            gap: 14px;
        }

        .trust-item {
            padding: 21px;
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .trust-item-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: #DCE7DE;
            font-size: 19px;
        }

        .trust-item h3 {
            color: var(--green);
            font-size: 15px;
        }

        .trust-item p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           HAKAMIDZO WAY
        ========================= */

        .way {
            background: var(--green);
            color: var(--white);
        }

        .way-inner {
            max-width: 1400px;
            margin: auto;
            padding: 95px 36px;
            text-align: center;
        }

        .way-label {
            color: var(--gold);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.7px;
        }

        .way h2 {
            margin-top: 12px;
            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .way-description {
            max-width: 650px;
            margin: 18px auto 0;
            color: rgba(255, 255, 255, 0.7);
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 48px;
        }

        .step {
            padding: 25px 18px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
        }

        .step-number {
            color: var(--gold);
            font-weight: 900;
            font-size: 12px;
        }

        .step h3 {
            margin-top: 8px;
            font-size: 16px;
        }

        .step p {
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #0B2A23;
            color: var(--white);
        }

        .footer-inner {
            max-width: 1400px;
            margin: auto;
            padding: 45px 36px 25px;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            align-items: flex-start;
        }

        .footer-brand {
            max-width: 400px;
        }

        .footer-brand strong {
            font-size: 21px;
            letter-spacing: 2px;
        }

        .footer-brand p {
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.62);
            font-size: 13px;
        }

        .footer-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            color: rgba(255, 255, 255, 0.72);
            font-size: 12px;
        }

        .footer-bottom {
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1050px) {
            .nav {
                padding: 14px 25px;
            }

            .nav-links {
                gap: 15px;
                font-size: 9px;
            }

            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 70px;
            }

            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-actions {
                justify-content: center;
            }

            .gateway-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .trust-content {
                grid-template-columns: 1fr;
            }

            .steps {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .nav {
                min-height: 70px;
                padding: 12px 18px;
            }

            .brand-mark {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }

            .brand-name {
                font-size: 17px;
            }

            .brand-tagline {
                font-size: 9px;
            }

            .nav-links {
                display: none;
            }

            .mobile-menu {
                display: block;
            }

            .hero {
                padding: 58px 20px 55px;
                gap: 45px;
            }

            .hero h1 {
                font-size: 46px;
                letter-spacing: -2.5px;
            }

            .hero-description {
                font-size: 16px;
            }

            .hero-actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

            .connection {
                width: 310px;
            }

            .connection-node {
                min-width: 88px;
                padding: 10px 6px;
                font-size: 10px;
            }

            .section {
                padding: 25px 20px 65px;
            }

            .gateway-grid {
                grid-template-columns: 1fr;
            }

            .gateway {
                min-height: 220px;
                padding: 25px;
            }

            .trust-content {
                padding: 65px 20px;
            }

            .way-inner {
                padding: 70px 20px;
            }

            .steps {
                grid-template-columns: 1fr;
            }

            .footer-inner {
                padding-left: 20px;
                padding-right: 20px;
            }

            .footer-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>
        <nav class="nav">

            <a href="/" class="brand" aria-label="Hakamidzo home">
                <span class="brand-mark">H</span>

                <span>
                    <strong class="brand-name">HAKAMIDZO</strong>
                    <span class="brand-tagline">
                        Connect, let’s go.
                    </span>
                </span>
            </a>

            <div class="nav-links">
                <a href="#gateways">I NEED SOMETHING</a>
                <a href="#gateways">EXPLORE</a>
                <a href="#gateways">I CAN SUPPLY</a>
                <a href="#gateways">PARTNER</a>
                <a href="#account" class="nav-account">ACCOUNT</a>
            </div>

            <button
                class="mobile-menu"
                type="button"
                aria-label="Open menu"
                onclick="toggleMobileMenu()"
            >
                ☰
            </button>

        </nav>
    </header>


    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="hero">

            <div>

                <span class="eyebrow">
                    <span class="eyebrow-dot"></span>
                    ONE PLATFORM. MANY POSSIBILITIES.
                </span>

                <h1>
                    Where the world connects<span>.</span>
                </h1>

                <p class="hero-description">
                    Discover products, services, businesses and opportunities —
                    or tell Hakamidzo what you need.
                </p>

                <div class="hero-actions">

                    <a
                        href="#gateways"
                        class="button button-primary"
                    >
                        Explore Hakamidzo →
                    </a>

                    <a
                        href="#gateways"
                        class="button button-secondary"
                    >
                        I need something
                    </a>

                </div>

            </div>
